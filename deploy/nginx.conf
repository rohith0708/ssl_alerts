# /etc/nginx/sites-available/sslalerts.online
# Reverse proxy: nginx handles TLS (via certbot) and forwards to the
# Node app running on port 3000 inside the box.

server {
    listen 80;
    listen [::]:80;
    server_name sslalerts.online www.sslalerts.online;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    client_max_body_size 10M;
}

# After this file is enabled, run:
#   sudo certbot --nginx -d sslalerts.online -d www.sslalerts.online
# Certbot will rewrite this file to add the SSL server block (port 443,
# certificate paths, and an http->https redirect) automatically.
