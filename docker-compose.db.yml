services:
  mysql:
    image: mysql:8.0
    container_name: harisree-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: harisree_root_secret
      MYSQL_DATABASE: harisree_ssl
      MYSQL_USER: harisree_user
      MYSQL_PASSWORD: harisree_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - harisree-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pharisree_root_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mysql_data:

networks:
  harisree-network:
    name: harisree-network
